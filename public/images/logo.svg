<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8a52"/>
      <stop offset=".55" stop-color="#135133"/>
      <stop offset="1" stop-color="#0e3b25"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#g)"/>
  <!-- franjas de pasto -->
  <g fill="#fff" opacity=".07">
    <rect x="18" y="22" width="13" height="56"/>
    <rect x="44" y="22" width="13" height="56"/>
    <rect x="70" y="22" width="12" height="56"/>
  </g>
  <!-- cancha de fútbol (vista cenital) -->
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="16" y="22" width="68" height="56" rx="2"/>
    <line x1="50" y1="22" x2="50" y2="78"/>
    <circle cx="50" cy="50" r="9"/>
    <!-- áreas grandes -->
    <rect x="16" y="35" width="13" height="30"/>
    <rect x="71" y="35" width="13" height="30"/>
    <!-- áreas chicas -->
    <rect x="16" y="43" width="5" height="14"/>
    <rect x="79" y="43" width="5" height="14"/>
  </g>
  <circle cx="50" cy="50" r="1.8" fill="#fff"/>
  <circle cx="35" cy="50" r="1.3" fill="#fff"/>
  <circle cx="65" cy="50" r="1.3" fill="#fff"/>
